<!doctype html>
<html lang="@@LANG@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>@@DOC_TITLE@@</title>
<style>
/* The maintenance page (README.md, «La pagina»), drawn as a screen of the template's frontend: its
   NotFoundView and AuthLayout (a centred column on the page background, no card), its Button and Badge.
   gateway.sh fills every placeholder at start, escaped or picked from a fixed list.

   THE TOKENS. Everything below the two blocks reads these and nothing else: no colour, size, radius or
   font is written anywhere else in this file. The colours carry the frontend's names
   (packages/shared/src/styles/themes/*.css in the template) and come from the theme gateway.sh picked
   (MAINTENANCE_THEME, the same choice as the frontend's VITE_BRAND) with the page's colour variables
   on top. tests/page_check.py measures every pair that carries text or marks a control, in both themes. */
:root {
  color-scheme: light dark;
  --color-background: @@L_BACKGROUND@@;
  --color-foreground: @@L_FOREGROUND@@;
  --color-heading: @@L_HEADING@@;
  --color-card: @@L_CARD@@;
  --color-accent: @@L_ACCENT@@;
  --color-muted-foreground: @@L_MUTED_FOREGROUND@@;
  --color-border: @@L_BORDER@@;
  --color-control: @@L_CONTROL@@;
  --color-ring: @@L_RING@@;
  --color-primary: @@L_PRIMARY@@;
  --color-primary-foreground: @@L_PRIMARY_FOREGROUND@@;
  --color-primary-edge: @@L_PRIMARY_EDGE@@;
  --color-caution: @@L_CAUTION@@;
  --color-caution-surface: @@L_CAUTION_SURFACE@@;
  --color-caution-border: @@L_CAUTION_BORDER@@;
  --color-negative: @@L_NEGATIVE@@;
  --color-negative-surface: @@L_NEGATIVE_SURFACE@@;
  --color-negative-border: @@L_NEGATIVE_BORDER@@;

  /* The frontend's radius scale: md is the anchor, the others x0.5 and x1.5. */
  --radius: @@RADIUS@@;
  --radius-sm: calc(var(--radius) * 0.5);
  --radius-md: var(--radius);
  --radius-lg: calc(var(--radius) * 1.5);
  --font-sans: @@FONT@@;

  /* Tailwind's steps, as the frontend's classes use them: text-xs, text-sm, text-2xl, gap-2... */
  --text-xs: 0.75rem;
  --text-xs-line: 1rem;
  --text-sm: 0.875rem;
  --text-sm-line: 1.25rem;
  --text-2xl: 1.5rem;
  --text-2xl-line: 2rem;
  --tracking-tight: -0.025em;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --column: 28rem;
  --icon: 1rem;
  --logo: 2.25rem;
  /* A button is h-9 in the frontend; on a narrow screen it grows to a 44 px touch target. */
  --control-height: 2.25rem;
  --ring-width: 3px;
  --underline-offset: 0.2em;
  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --duration: 200ms;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-background: @@D_BACKGROUND@@;
    --color-foreground: @@D_FOREGROUND@@;
    --color-heading: @@D_HEADING@@;
    --color-card: @@D_CARD@@;
    --color-accent: @@D_ACCENT@@;
    --color-muted-foreground: @@D_MUTED_FOREGROUND@@;
    --color-border: @@D_BORDER@@;
    --color-control: @@D_CONTROL@@;
    --color-ring: @@D_RING@@;
    --color-primary: @@D_PRIMARY@@;
    --color-primary-foreground: @@D_PRIMARY_FOREGROUND@@;
    --color-primary-edge: @@D_PRIMARY_EDGE@@;
    --color-caution: @@D_CAUTION@@;
    --color-caution-surface: @@D_CAUTION_SURFACE@@;
    --color-caution-border: @@D_CAUTION_BORDER@@;
    --color-negative: @@D_NEGATIVE@@;
    --color-negative-surface: @@D_NEGATIVE_SURFACE@@;
    --color-negative-border: @@D_NEGATIVE_BORDER@@;
  }
}
@media (max-width: 34rem) {
  :root { --control-height: 2.75rem; }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; border: 0 solid var(--color-border); }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--color-background);
  color: var(--color-foreground);
  font-family: var(--font-sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
/* margin: auto rather than centring on the parent, as AuthLayout: a column taller than the window
   stays reachable from its top. */
main {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-4);
  width: 100%;
  max-width: var(--column);
  margin: auto;
  padding: var(--space-8) var(--space-4);
  text-align: center;
  overflow-wrap: anywhere;
}
.brand {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
  font-size: var(--text-sm);
  line-height: var(--text-sm-line);
  font-weight: var(--weight-semibold);
}
.brand img { display: block; height: var(--logo); width: auto; max-width: calc(var(--logo) * 5); object-fit: contain; }
/* Badge, in the status tone: caution while maintenance is on, negative when the app is down. */
.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: calc(var(--space-1) / 2) var(--space-2);
  border-width: 1px;
  border-radius: var(--radius-md);
  font-size: var(--text-xs);
  line-height: var(--text-xs-line);
  font-weight: var(--weight-medium);
}
.badge-caution { border-color: var(--color-caution-border); background: var(--color-caution-surface); color: var(--color-caution); }
.badge-negative { border-color: var(--color-negative-border); background: var(--color-negative-surface); color: var(--color-negative); }
.dot { position: relative; width: var(--space-2); height: var(--space-2); border-radius: 50%; background: currentColor; }
.dot::after {
  content: "";
  position: absolute;
  inset: calc(var(--space-1) * -1);
  border-radius: 50%;
  border: 2px solid currentColor;
  opacity: 0;
  animation: ping 2.4s cubic-bezier(0, 0, 0.2, 1) infinite;
}
@keyframes ping {
  0% { transform: scale(0.6); opacity: 0.7; }
  80%, 100% { transform: scale(1.6); opacity: 0; }
}
h1 {
  color: var(--color-heading);
  font-size: var(--text-2xl);
  line-height: var(--text-2xl-line);
  font-weight: var(--weight-bold);
  letter-spacing: var(--tracking-tight);
  text-wrap: balance;
}
.message, .auto, .meta, .until-label { color: var(--color-muted-foreground); }
.message { font-size: var(--text-sm); line-height: var(--text-sm-line); }
.message p + p { margin-top: var(--space-3); }
.until {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-width: 1px;
  border-radius: var(--radius-lg);
  background: var(--color-card);
  font-size: var(--text-sm);
  line-height: var(--text-sm-line);
  text-align: left;
}
.until-label { display: block; font-size: var(--text-xs); line-height: var(--text-xs-line); }
.until time { display: block; font-weight: var(--weight-medium); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); margin-top: var(--space-2); }
.auto, .meta { font-size: var(--text-xs); line-height: var(--text-xs-line); }
.icon {
  flex: none;
  width: var(--icon);
  height: var(--icon);
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
/* Button: .btn is the outline variant, .btn-primary the default one. */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--control-height);
  padding: var(--space-2) var(--space-4);
  border: 1px solid var(--color-control);
  border-radius: var(--radius-md);
  background: var(--color-background);
  box-shadow: var(--shadow-xs);
  color: var(--color-foreground);
  font: inherit;
  font-size: var(--text-sm);
  line-height: var(--text-sm-line);
  font-weight: var(--weight-medium);
  text-decoration: none;
  transition: background-color var(--duration) ease-out;
}
.btn:hover { background: var(--color-accent); }
.btn-primary { border-color: var(--color-primary-edge); background: var(--color-primary); color: var(--color-primary-foreground); }
.btn-primary:hover { background: var(--color-primary); text-decoration: underline; text-underline-offset: var(--underline-offset); }
.btn:focus-visible { outline: var(--ring-width) solid var(--color-ring); outline-offset: 2px; }
.contacts { width: 100%; margin-top: var(--space-4); padding-top: var(--space-6); border-top-width: 1px; }
.contacts h2 { margin-bottom: var(--space-3); font-size: var(--text-sm); line-height: var(--text-sm-line); font-weight: var(--weight-semibold); }
.contacts ul { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-2); padding: 0; list-style: none; }
.meta { padding: 0 var(--space-4) var(--space-6); text-align: center; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
@media (max-width: 34rem) {
  .actions { align-self: stretch; }
  .contacts ul { flex-direction: column; }
  .btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (forced-colors: active) {
  .btn, .badge { border-color: ButtonText; }
  .dot { background: CanvasText; }
}
</style>
</head>
<body>
<main>
@@BRAND@@
<p class="badge badge-@@TONE@@ status"><span class="dot" aria-hidden="true"></span>@@STATUS@@</p>
<h1>@@TITLE@@</h1>
<div class="message">
@@MESSAGE@@
</div>
@@UNTIL@@
<div class="actions">
<a class="btn btn-primary" href="" id="gw-retry"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>@@RETRY@@</a>
<p class="auto" id="gw-auto" hidden>@@AUTO@@ <span id="gw-last" data-text="@@LAST@@"></span></p>
</div>
<p class="sr-only" id="gw-live" role="status" data-text="@@BACK@@"></p>
@@CONTACTS@@
</main>
<footer class="meta">@@CODE@@</footer>
<script>
// While this page is open, ask the same address every now and then (10 s, growing to a minute, and
// never while the tab is hidden). The gateway's page carries X-Gateway: maintenance and the app does
// not, so an answer without it means the service is back: reload. A network error just waits.
(function () {
  var auto = document.getElementById('gw-auto');
  var last = document.getElementById('gw-last');
  var live = document.getElementById('gw-live');
  if (!window.fetch || !auto) return;
  auto.hidden = false;
  var first = 10000, delay = first, max = 60000, timer = 0, busy = false;
  var here = location.href.split('#')[0];
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function schedule() {
    clearTimeout(timer);
    if (!document.hidden) timer = setTimeout(check, delay);
  }
  function check() {
    if (busy) return;
    busy = true;
    fetch(here, { cache: 'no-store', redirect: 'manual', credentials: 'same-origin', headers: { Accept: 'text/html' } })
      .then(function (response) {
        if (response.body && response.body.cancel) response.body.cancel();
        if (response.type === 'opaqueredirect' || response.headers.get('X-Gateway') !== 'maintenance') {
          live.textContent = live.getAttribute('data-text');
          location.replace(here);
          return true;
        }
        var now = new Date();
        last.textContent = last.getAttribute('data-text').replace('{time}', two(now.getHours()) + ':' + two(now.getMinutes()));
      }, function () {})
      .then(function (back) {
        busy = false;
        if (back) return;
        delay = Math.min(max, Math.round(delay * 1.5));
        schedule();
      });
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { clearTimeout(timer); return; }
    delay = first;
    check();
  });
  schedule();
})();
</script>
</body>
</html>
