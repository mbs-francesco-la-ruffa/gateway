<!doctype html>
<html lang="@@LANG@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>@@DOC_TITLE@@</title>
<style>
/* The maintenance page (README.md, «La pagina»), in the style of a public service's error page: GOV.UK's
   «Sorry, the service is unavailable» and the header of Designers Italia / Bootstrap Italia. A header band
   with the name, then one left-aligned column: the state, a plain title, the message, a list of what the
   visitor can do, «Riprova». gateway.sh fills every placeholder at start, escaped or picked from a fixed list.

   THE TOKENS. Everything below the two blocks reads these and nothing else: no colour, size, radius or
   font is written anywhere else in this file. The colours carry the frontend's names
   (packages/shared/src/styles/themes/*.css in the template) and come from the theme gateway.sh picked
   (MAINTENANCE_THEME, the same choice as the frontend's VITE_BRAND) with the page's colour variables
   on top. tests/page_check.py measures every pair that carries text or marks a control, in both themes. */
:root {
  color-scheme: light dark;
  --color-background: @@L_BACKGROUND@@;
  --color-foreground: @@L_FOREGROUND@@;
  --color-heading: @@L_HEADING@@;
  --color-card: @@L_CARD@@;
  --color-muted-foreground: @@L_MUTED_FOREGROUND@@;
  --color-border: @@L_BORDER@@;
  --color-ring: @@L_RING@@;
  --color-link: @@L_LINK@@;
  --color-primary: @@L_PRIMARY@@;
  --color-primary-foreground: @@L_PRIMARY_FOREGROUND@@;
  --color-primary-edge: @@L_PRIMARY_EDGE@@;
  --color-caution: @@L_CAUTION@@;
  --color-caution-surface: @@L_CAUTION_SURFACE@@;
  --color-caution-border: @@L_CAUTION_BORDER@@;
  --color-negative: @@L_NEGATIVE@@;
  --color-negative-surface: @@L_NEGATIVE_SURFACE@@;
  --color-negative-border: @@L_NEGATIVE_BORDER@@;

  /* The frontend's radius scale: md is the anchor, the others x0.5 and x1.5. */
  --radius: @@RADIUS@@;
  --radius-sm: calc(var(--radius) * 0.5);
  --radius-md: var(--radius);
  --radius-lg: calc(var(--radius) * 1.5);
  --font-sans: @@FONT@@;

  /* The type: a reading size larger than an app screen's, as a public service page has it. */
  --text-sm: 0.875rem;
  --text-sm-line: 1.25rem;
  --text-base: 1rem;
  --text-body: 1.125rem;
  --text-body-line: 1.6;
  --text-name: 1.125rem;
  --text-h2: 1.25rem;
  --text-h2-line: 1.4;
  --text-h1: 2.25rem;
  --text-h1-line: 1.15;
  --tracking-tight: -0.02em;
  --tracking-name: -0.01em;
  --weight-medium: 500;
  --weight-bold: 700;
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-12: 3rem;
  --column: 44rem;
  --title-column: 32rem;
  --icon: 1rem;
  --mark: 1.5rem;
  --logo: 2.25rem;
  --stripe: 4px;
  /* One control, 44 px tall everywhere: a touch target on a phone, and the size GOV.UK gives its button. */
  --control-height: 2.75rem;
  --control-padding: 0.625rem;
  --control-shadow: 0 2px 0;
  --ring-width: 3px;
  --underline-offset: 0.2em;
  --underline: 1px;
  --underline-hover: 3px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-background: @@D_BACKGROUND@@;
    --color-foreground: @@D_FOREGROUND@@;
    --color-heading: @@D_HEADING@@;
    --color-card: @@D_CARD@@;
    --color-muted-foreground: @@D_MUTED_FOREGROUND@@;
    --color-border: @@D_BORDER@@;
    --color-ring: @@D_RING@@;
    --color-link: @@D_LINK@@;
    --color-primary: @@D_PRIMARY@@;
    --color-primary-foreground: @@D_PRIMARY_FOREGROUND@@;
    --color-primary-edge: @@D_PRIMARY_EDGE@@;
    --color-caution: @@D_CAUTION@@;
    --color-caution-surface: @@D_CAUTION_SURFACE@@;
    --color-caution-border: @@D_CAUTION_BORDER@@;
    --color-negative: @@D_NEGATIVE@@;
    --color-negative-surface: @@D_NEGATIVE_SURFACE@@;
    --color-negative-border: @@D_NEGATIVE_BORDER@@;
  }
}
@media (max-width: 34rem) {
  :root {
    --text-body: 1rem;
    --text-h1: 1.75rem;
    --space-12: 2rem;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; border: 0 solid var(--color-border); }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--color-background);
  color: var(--color-foreground);
  font-family: var(--font-sans);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: anywhere;
}
/* The header band: the name on the card colour, over a stripe of the primary colour. With no name and
   no logo it is the stripe alone. */
.head { border-bottom: var(--stripe) solid var(--color-primary-edge); background: var(--color-card); }
.wrap { width: 100%; max-width: var(--column); margin: 0 auto; padding-left: var(--space-5); padding-right: var(--space-5); }
.brand {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding-top: var(--space-4);
  padding-bottom: var(--space-4);
  color: var(--color-heading);
  font-size: var(--text-name);
  font-weight: var(--weight-bold);
  letter-spacing: var(--tracking-name);
}
.brand img { display: block; height: var(--logo); width: auto; max-width: calc(var(--logo) * 5); object-fit: contain; }
main { flex: 1; padding-top: var(--space-12); padding-bottom: var(--space-12); }
/* The state, above the title: its mark in the status tone (caution for maintenance, negative when the
   app is down), on the tone's own surface; the words in the secondary ink. */
.status {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-bottom: var(--space-1);
  color: var(--color-muted-foreground);
  font-size: var(--text-base);
}
.mark {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: var(--mark);
  height: var(--mark);
  border-width: 1px;
  border-radius: 50%;
}
.status-caution .mark { border-color: var(--color-caution-border); background: var(--color-caution-surface); color: var(--color-caution); }
.status-negative .mark { border-color: var(--color-negative-border); background: var(--color-negative-surface); color: var(--color-negative); }
h1, h2 { color: var(--color-heading); font-weight: var(--weight-bold); }
h1 {
  max-width: var(--title-column);
  margin-bottom: var(--space-6);
  font-size: var(--text-h1);
  line-height: var(--text-h1-line);
  letter-spacing: var(--tracking-tight);
  text-wrap: balance;
}
h2 { margin: var(--space-8) 0 var(--space-3); font-size: var(--text-h2); line-height: var(--text-h2-line); }
main p, main li { font-size: var(--text-body); line-height: var(--text-body-line); }
.message p + p, .until { margin-top: var(--space-4); }
.until time { font-variant-numeric: tabular-nums; }
.next { display: grid; gap: var(--space-2); padding-left: var(--space-5); }
main a:not(.btn) {
  color: var(--color-link);
  font-weight: var(--weight-medium);
  text-decoration-thickness: var(--underline);
  text-underline-offset: var(--underline-offset);
}
main a:not(.btn):hover { text-decoration-thickness: var(--underline-hover); }
a:focus-visible { outline: var(--ring-width) solid var(--color-ring); outline-offset: 2px; border-radius: var(--radius-sm); }
.icon {
  flex: none;
  width: var(--icon);
  height: var(--icon);
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
/* The one button, the primary colour with a darker lip under it, as GOV.UK draws its own. */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--control-height);
  margin-top: var(--space-8);
  padding: var(--control-padding) var(--space-5);
  border: 1px solid var(--color-primary-edge);
  border-radius: var(--radius-sm);
  background: var(--color-primary);
  box-shadow: var(--control-shadow) var(--color-heading);
  color: var(--color-primary-foreground);
  font: inherit;
  font-size: var(--text-base);
  line-height: var(--text-sm-line);
  font-weight: var(--weight-medium);
  text-decoration: none;
}
.btn:hover { text-decoration: underline; text-underline-offset: var(--underline-offset); }
main .auto { margin-top: var(--space-3); color: var(--color-muted-foreground); font-size: var(--text-sm); line-height: var(--text-sm-line); }
.foot { border-top-width: 1px; background: var(--color-card); }
.foot p { padding-top: var(--space-5); padding-bottom: var(--space-6); color: var(--color-muted-foreground); font-size: var(--text-sm); line-height: var(--text-sm-line); }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
@media (max-width: 34rem) {
  .btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media (forced-colors: active) {
  .head { border-bottom-color: CanvasText; }
  .btn, .mark { border-color: ButtonText; }
}
</style>
</head>
<body>
<header class="head">@@BRAND@@</header>
<main class="wrap">
<p class="status status-@@TONE@@"><span class="mark" aria-hidden="true">@@MARK@@</span>@@STATUS@@</p>
<h1>@@TITLE@@</h1>
<div class="message">
@@MESSAGE@@
</div>
@@UNTIL@@
<h2>@@NEXT@@</h2>
<ul class="next">
@@STEPS@@
</ul>
<a class="btn" href="" id="gw-retry"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>@@RETRY@@</a>
<p class="auto" id="gw-auto" hidden>@@AUTO@@ <span id="gw-last" data-text="@@LAST@@"></span></p>
<p class="sr-only" id="gw-live" role="status" data-text="@@BACK@@"></p>
</main>
<footer class="foot"><p class="wrap">@@CODE@@</p></footer>
<script>
// While this page is open, ask the same address every now and then (10 s, growing to a minute, and
// never while the tab is hidden). The gateway's page carries X-Gateway: maintenance and the app does
// not, so an answer without it means the service is back: reload. A network error just waits.
(function () {
  var auto = document.getElementById('gw-auto');
  var last = document.getElementById('gw-last');
  var live = document.getElementById('gw-live');
  if (!window.fetch || !auto) return;
  auto.hidden = false;
  var first = 10000, delay = first, max = 60000, timer = 0, busy = false;
  var here = location.href.split('#')[0];
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function schedule() {
    clearTimeout(timer);
    if (!document.hidden) timer = setTimeout(check, delay);
  }
  function check() {
    if (busy) return;
    busy = true;
    fetch(here, { cache: 'no-store', redirect: 'manual', credentials: 'same-origin', headers: { Accept: 'text/html' } })
      .then(function (response) {
        if (response.body && response.body.cancel) response.body.cancel();
        if (response.type === 'opaqueredirect' || response.headers.get('X-Gateway') !== 'maintenance') {
          live.textContent = live.getAttribute('data-text');
          location.replace(here);
          return true;
        }
        var now = new Date();
        last.textContent = last.getAttribute('data-text').replace('{time}', two(now.getHours()) + ':' + two(now.getMinutes()));
      }, function () {})
      .then(function (back) {
        busy = false;
        if (back) return;
        delay = Math.min(max, Math.round(delay * 1.5));
        schedule();
      });
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { clearTimeout(timer); return; }
    delay = first;
    check();
  });
  schedule();
})();
</script>
</body>
</html>
